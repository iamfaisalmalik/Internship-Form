<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
    <link rel="stylesheet" href="./form.css">
</head>
<body>
    <form>
    <h1>Internship Application Form</h1>
    <fieldset>
        
        <legend>Student Internship Application. *Required</legend><br><br>


        <label for="name">Full Name *</label><br>
        <input class="input" type="text" id="name" name="name" required placeholder="Eg: Faisal Malik"><br><br>

        <label for="email">Email *</label><br>
        <input class="input" type="email" id="email" name="email" required placeholder="Eg: faisal@example.com"><br><br>

        <label for="password" >Password *</label><br>
        <input class="input" type="password" id="password" name="password" required placeholder="choose a strong password"><br><br>

        <label for="phone">Phone Number *</label><br>
        <input class="input" type="tel" id="phone" name="phone" required placeholder="Eg: 9876543210"><br><br>

        <label for="portfolio_url">Portfolio URL</label><br>
        <input class="input" type="url" id="portfolio_url" name="portfolio_url" placeholder="Eg: https://faisal.com/portfolio"><br><br>

        <label for="age">Age *</label><br> <br>
        <input class="input" type="number" id="age" name="age" required placeholder="Eg: 18" min="0"><br><br>


        <label for="gender">Gender *</label><br>
        <input type="radio" id="male" name="gender" value="male" required>

        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>

        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>

        <label for="other">Other/Prefer not to say</label><br><br><br><br>

        

    </fieldset>
    </form>
</body>
</html>
